[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odeaudit"
version = "0.1.0"
description = "Achieved-vs-requested accuracy audit of ODE solvers (SciPy, odeint, diffrax, torchdiffeq) on the Hairer stiff and DETEST test sets"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Bahumanya R G" }]
keywords = ["ODE", "stiff", "solve_ivp", "diffrax", "torchdiffeq", "numerical accuracy", "DETEST"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]

[project.optional-dependencies]
jax = ["jax>=0.4", "diffrax>=0.5"]
torch = ["torch>=2.0", "torchdiffeq>=0.2"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
odeaudit = "odeaudit.cli:main"

[tool.setuptools.packages.find]
include = ["odeaudit*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E741", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
